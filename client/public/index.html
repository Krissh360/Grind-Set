<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/flame-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <meta
      name="description"
      content="Grind Set: daily momentum for meaningful habits"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/flame-logo.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    
    <title>Grind Set — Daily Momentum</title>
  </head>
  <body>
    <script>
      // Apply saved theme before first paint (per-user, falls back to device-wide)
      (function () {
        try {
          var u = JSON.parse(localStorage.getItem("user") || "{}");
          var id = u._id || u.id;
          var t = (id && localStorage.getItem("theme:" + id)) || localStorage.getItem("theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
  </body>
</html>
